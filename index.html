<!DOCTYPE html>
<html>

<head>
    <title>Assignment_11</title>
    <style>
        body {

            background-color: rgb(244, 249, 249);

        .container {
            display: flex;

        .item {

        }

.label {
    background: #eaeaea;
    border-radius: 30px;

}


        .project-duration {

        .project-developer {
            font-size: 12px;
